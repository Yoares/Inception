[www]
user = www-data
group = www-data

; This is the crucial line: Listen on port 9000 instead of a Unix socket
listen = 9000

; Allow connections from any IP on the Docker network
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no