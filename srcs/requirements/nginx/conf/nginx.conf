server {
    # 1. The Entrypoint & Security rules
    listen 443 ssl;
    server_name ykhoussi.42.fr;

    # Point to the certificates we generated in the Dockerfile
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # Strictly enforce TLSv1.2 and TLSv1.3[cite: 1]
    ssl_protocols TLSv1.2 TLSv1.3;

    # 2. The Root Directory
    # This must match the exact directory where WordPress installed its files
    root /var/www/html;
    index index.php index.html ;

    # 3. Standard file routing
    location / {
        try_files $uri $uri/ =404;
    }

    location /static {
        proxy_pass http://static_site:80/;
    }

    location /adminer {
        proxy_pass http://adminer:8080/;
    }

    location /cadvisor {
        proxy_pass http://cadvisor:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 4. PHP Translation Routing
    # If the file ends in .php, send it to the WordPress container
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        # 'wordpress' is the container name. Docker's internal DNS will resolve this to the correct IP.
        fastcgi_pass wordpress:9000;
    }
}